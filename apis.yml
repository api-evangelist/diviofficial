aid: diviofficial
name: Divi Official
description: >-
  Divi Official Inc. (Divi Growth Care) is a direct-to-consumer haircare and
  scalp-care brand formulated "for women by women," selling vegan,
  science-backed serums, shampoos, conditioners and supplements aimed at the
  hair-growth journey. The company operates an e-commerce storefront hosted on
  Shopify at diviofficial.com, with a subscription "Club Divi" program, a
  content blog, and a customer-account experience. Divi is a portfolio company
  of Norwest Venture Partners. It is a consumer packaged goods / beauty
  commerce business and does not publish a first-party developer API, SDK, or
  developer portal; the only machine-readable surfaces on its domain are the
  Shopify Customer Accounts OAuth/OIDC discovery documents that the storefront
  platform exposes. This profile captures the company's public identity, web
  properties, and domain-security posture for the API Evangelist network.
